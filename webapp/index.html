<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Семейный бюджет</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <h1 id="screen-title">Главная</h1>
  </header>

  <main id="screen-home" class="screen">
    <section class="card accent">
      <div class="card-row">
        <span class="label">Общий остаток</span>
        <span class="value" id="shared-remaining">—</span>
      </div>
      <div class="sub" id="shared-breakdown">—</div>
      <div id="per-person-list" class="list per-person-list"></div>
    </section>

    <section class="card">
      <div class="card-row">
        <span class="label">Мой личный бюджет</span>
        <span class="value" id="personal-remaining">—</span>
      </div>
      <div class="sub" id="personal-breakdown">—</div>
      <div class="budget-form">
        <input id="budget-input" type="text" inputmode="decimal" placeholder="10000 или +500 / -300">
        <button id="budget-submit">Задать</button>
      </div>
      <div class="hint" id="budget-hint"></div>
    </section>

    <section class="card">
      <div class="card-row">
        <span class="label">Потрачено сегодня</span>
        <span class="value" id="today-total">—</span>
      </div>
    </section>

    <section class="card hidden" id="period-settings-card">
      <div class="card-title">Отчётный период (администратор)</div>
      <div class="sub" id="period-current">—</div>
      <div class="budget-form">
        <input id="period-input" type="number" min="1" max="31" placeholder="число месяца (1-31)">
        <button id="period-submit">Сохранить</button>
      </div>
      <div class="hint" id="period-hint"></div>
    </section>
  </main>

  <main id="screen-expenses" class="screen hidden">
    <div class="selects">
      <select id="expenses-scope-select">
        <option value="today">Сегодня</option>
        <option value="period">Текущий период</option>
        <option value="all">За всё время</option>
      </select>
      <select id="expenses-mode-select">
        <option value="categories">По категориям</option>
        <option value="detailed">Подробно</option>
      </select>
    </div>
    <div class="total-line" id="expenses-total"></div>
    <div id="expenses-list" class="list"></div>
  </main>

  <main id="screen-shopping" class="screen hidden">
    <div id="shopping-list" class="list"></div>
    <div class="shopping-form">
      <input id="shopping-input" type="text" placeholder="Что добавить (через запятую)">
      <button id="shopping-add">Добавить</button>
    </div>
    <button id="shopping-clear-done" class="secondary">Убрать выполненное</button>
  </main>

  <div id="toast" class="toast hidden"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="home"><span class="nav-icon">🏠</span><span class="nav-label">Главная</span></button>
    <button class="nav-btn" data-screen="expenses"><span class="nav-icon">🧾</span><span class="nav-label">Расходы</span></button>
    <button class="nav-btn" data-screen="shopping"><span class="nav-icon">🛒</span><span class="nav-label">Покупки</span></button>
  </nav>

</div>
<script src="app.js"></script>
</body>
</html>
